<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>QJ's Reel</title>
<meta name="description" content="A personal ledger of films and shows, rated honestly." />
<meta name="theme-color" content="#0b0b0d" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="grain"></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="#/" class="brand">
      <span class="brand-mark">QJ</span>
      <span class="brand-sep"></span>
      <span class="brand-name">The Reel</span>
    </a>
    <nav class="top-nav" id="top-nav">
      <a href="#/" data-route="home">Home</a>
      <a href="#/watched" data-route="watched">Watched</a>
      <a href="#/unwatched" data-route="unwatched">Watchlist</a>
      <a href="#/stats" data-route="stats">Stats</a>
    </nav>
  </div>
</header>

<main id="app">
  <div class="loading" id="loading">
    <p>Loading…</p>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>© <span id="year">—</span> QJ's Reel · Honest ratings, no middle grounds.</p>
    <p class="tiny">Posters & data courtesy of TMDB · Hosted on GitHub Pages</p>
  </div>
</footer>

<!-- Detail modal -->
<div id="modal" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="document">
    <button class="modal-close" data-close aria-label="Close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
